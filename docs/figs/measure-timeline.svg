<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','WenQuanYi Zen Hei',sans-serif" font-size="25">
  <defs>
    <pattern id="pB" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#fff"/><path d="M0,9 L9,0" stroke="#222" stroke-width="2.2"/></pattern>
    <pattern id="pD" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#fff"/><path d="M0,9 L9,0 M0,0 L9,9" stroke="#222" stroke-width="2"/></pattern>
    <pattern id="pL" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#fff"/><circle cx="5" cy="5" r="2.4" fill="#222"/></pattern>
    <pattern id="pX" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff"/><path d="M4,0 L4,8" stroke="#222" stroke-width="2.4"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>
  <rect width="900" height="600" fill="#fff"/>

  <!-- host clock -->
  <text x="40" y="38" font-size="24" font-weight="bold">호스트 시계: fio가 잰 지연</text>
  <rect x="40" y="52" width="190" height="52" fill="#eee" stroke="#111" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="135" y="86" text-anchor="middle" font-size="22">펌웨어 밖</text>
  <rect x="230" y="52" width="380" height="52" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <text x="420" y="86" text-anchor="middle" font-size="22">펌웨어 내부</text>
  <rect x="610" y="52" width="250" height="52" fill="#eee" stroke="#111" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="735" y="86" text-anchor="middle" font-size="22">펌웨어 밖</text>

  <!-- guides -->
  <path d="M230,104 L230,122 M230,158 L230,168" stroke="#111" stroke-width="1.8" stroke-dasharray="4 5"/>
  <path d="M610,104 L610,122 M610,158 L610,168" stroke="#111" stroke-width="1.8" stroke-dasharray="4 5"/>

  <!-- firmware clock -->
  <text x="40" y="146" font-size="24" font-weight="bold">펌웨어 시계: 타이머 카운터를 읽은 지점</text>
  <g stroke="#111" stroke-width="2.5">
    <rect x="230" y="168" width="30" height="60" fill="url(#pL)"/>
    <rect x="260" y="168" width="50" height="60" fill="url(#pB)"/>
    <rect x="310" y="168" width="90" height="60" fill="url(#pD)"/>
    <rect x="400" y="168" width="30" height="60" fill="url(#pL)"/>
    <rect x="430" y="168" width="40" height="60" fill="#555"/>
    <rect x="470" y="168" width="30" height="60" fill="url(#pX)"/>
    <rect x="500" y="168" width="50" height="60" fill="#555"/>
    <rect x="550" y="168" width="20" height="60" fill="url(#pL)"/>
    <rect x="570" y="168" width="40" height="60" fill="#555"/>
  </g>

  <!-- axis with tick marks (timer reads) -->
  <line x1="230" y1="252" x2="610" y2="252" stroke="#111" stroke-width="2.5"/>
  <g stroke="#111" stroke-width="2.5">
    <line x1="230" y1="228" x2="230" y2="262"/><line x1="260" y1="228" x2="260" y2="262"/><line x1="310" y1="228" x2="310" y2="262"/>
    <line x1="400" y1="228" x2="400" y2="262"/><line x1="430" y1="228" x2="430" y2="262"/><line x1="470" y1="228" x2="470" y2="262"/>
    <line x1="500" y1="228" x2="500" y2="262"/><line x1="550" y1="228" x2="550" y2="262"/><line x1="570" y1="228" x2="570" y2="262"/>
    <line x1="610" y1="228" x2="610" y2="262"/>
  </g>
  <g fill="#fff" stroke="#111" stroke-width="2.5">
    <circle cx="230" cy="252" r="7"/><circle cx="260" cy="252" r="7"/><circle cx="310" cy="252" r="7"/><circle cx="400" cy="252" r="7"/>
    <circle cx="430" cy="252" r="7"/><circle cx="470" cy="252" r="7"/><circle cx="500" cy="252" r="7"/><circle cx="550" cy="252" r="7"/>
    <circle cx="570" cy="252" r="7"/><circle cx="610" cy="252" r="7"/>
  </g>
  <text x="230" y="296" text-anchor="middle" font-size="22">fetch</text>
  <text x="610" y="296" text-anchor="middle" font-size="22">DMA 끝</text>

  <!-- brace: firmware internal delay -->
  <path d="M230,316 L230,328 L610,328 L610,316" stroke="#111" stroke-width="2.5" fill="none"/>
  <text x="420" y="362" text-anchor="middle" font-size="23">펌웨어 내부 지연 = 구간의 합</text>

  <!-- outside note -->
  <text x="40" y="410" font-size="23">펌웨어 밖 = 호스트 지연 − 펌웨어 내부 지연</text>

  <!-- legend -->
  <g font-size="22" stroke="#111" stroke-width="2">
    <rect x="40" y="436" width="46" height="30" fill="url(#pB)"/><text x="98" y="460" stroke="none">버퍼 대기</text>
    <rect x="260" y="436" width="46" height="30" fill="url(#pD)"/><text x="318" y="460" stroke="none">die 큐 대기</text>
    <rect x="500" y="436" width="46" height="30" fill="url(#pL)"/><text x="558" y="460" stroke="none">루프 지연</text>
    <rect x="40" y="482" width="46" height="30" fill="url(#pX)"/><text x="98" y="506" stroke="none">읽기 전송 대기</text>
    <rect x="260" y="482" width="46" height="30" fill="#555"/><text x="318" y="506" stroke="none">NAND·DMA</text>
    <circle cx="523" cy="497" r="7" fill="#fff"/><text x="558" y="506" stroke="none">타이머 읽기</text>
  </g>
  <text x="40" y="560" font-size="20" fill="#333">구간 길이는 실제 비율이 아님. 두 시계는 서로 맞춰져 있지 않아 각 시계 안의 길이만 쓴다.</text>
</svg>
